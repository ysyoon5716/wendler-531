<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wendler 5/3/1 프로그램 계산기">
  <link rel="stylesheet" href="src/style.css">
  <title>Wendler 5/3/1 계산기</title>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-center text-gray-800">Wendler 5/3/1 계산기</h1>
    </div>
    <div class="main bg-white rounded-lg shadow-md p-6">
      <div class="space-y-4">
        <div class="space-y-2">
          <label for="weight" class="block font-bold text-gray-700">Training Max 입력 (1RM 90%)</label>
          <input type="number" id="weight" min="0" step="5" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div class="space-y-2">
          <label for="week" class="block font-bold text-gray-700">주차 선택</label>
          <select id="week" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            <option value="1">1주차</option>
            <option value="2">2주차</option>
            <option value="3">3주차</option>
            <option value="4">4주차</option>
            <option value="5">5주차</option>
            <option value="6">6주차</option>
            <option value="7">7주차</option>
          </select>
        </div>
        <button id="calculate" class="w-full bg-indigo-600 text-white py-2 px-4 h-10 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          계산하기
        </button>
      </div>
      <div id="results" class="mt-6"></div>
      <div id="weight-calculator" class="mt-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">무게 계산기</h2>
        <div class="space-y-4">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">바벨 종류</label>
                <select id="barbell" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="45">남자 바벨 (45lb)</option>
                    <option value="35">여자 바벨 (35lb)</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">45lb 원판</label>
                    <div class="flex items-center">
                        <button class="plate-decrement w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-l-md hover:bg-gray-300" data-plate="45">-</button>
                        <input type="number" id="plate-45" min="0" max="10" value="0" class="plate-input w-16 h-8 text-center border-t border-b border-gray-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                        <button class="plate-increment w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-r-md hover:bg-gray-300" data-plate="45">+</button>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">35lb 원판</label>
                    <div class="flex items-center">
                        <button class="plate-decrement w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-l-md hover:bg-gray-300" data-plate="35">-</button>
                        <input type="number" id="plate-35" min="0" max="10" value="0" class="plate-input w-16 h-8 text-center border-t border-b border-gray-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                        <button class="plate-increment w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-r-md hover:bg-gray-300" data-plate="35">+</button>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">25lb 원판</label>
                    <div class="flex items-center">
                        <button class="plate-decrement w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-l-md hover:bg-gray-300" data-plate="25">-</button>
                        <input type="number" id="plate-25" min="0" max="10" value="0" class="plate-input w-16 h-8 text-center border-t border-b border-gray-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                        <button class="plate-increment w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-r-md hover:bg-gray-300" data-plate="25">+</button>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">15lb 원판</label>
                    <div class="flex items-center">
                        <button class="plate-decrement w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-l-md hover:bg-gray-300" data-plate="15">-</button>
                        <input type="number" id="plate-15" min="0" max="10" value="0" class="plate-input w-16 h-8 text-center border-t border-b border-gray-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                        <button class="plate-increment w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-r-md hover:bg-gray-300" data-plate="15">+</button>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">10lb 원판</label>
                    <div class="flex items-center">
                        <button class="plate-decrement w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-l-md hover:bg-gray-300" data-plate="10">-</button>
                        <input type="number" id="plate-10" min="0" max="10" value="0" class="plate-input w-16 h-8 text-center border-t border-b border-gray-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                        <button class="plate-increment w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-r-md hover:bg-gray-300" data-plate="10">+</button>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">5lb 원판</label>
                    <div class="flex items-center">
                        <button class="plate-decrement w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-l-md hover:bg-gray-300" data-plate="5">-</button>
                        <input type="number" id="plate-5" min="0" max="10" value="0" class="plate-input w-16 h-8 text-center border-t border-b border-gray-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                        <button class="plate-increment w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-r-md hover:bg-gray-300" data-plate="5">+</button>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">2.5lb 원판</label>
                    <div class="flex items-center">
                        <button class="plate-decrement w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-l-md hover:bg-gray-300" data-plate="2_5">-</button>
                        <input type="number" id="plate-2_5" min="0" max="10" value="0" class="plate-input w-16 h-8 text-center border-t border-b border-gray-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                        <button class="plate-increment w-8 h-8 flex items-center justify-center bg-gray-200 text-gray-700 rounded-r-md hover:bg-gray-300" data-plate="2_5">+</button>
                    </div>
                </div>
            </div>
            <div class="mt-4 p-4 bg-gray-50 rounded-lg">
                <div class="text-center">
                    <span class="text-sm text-gray-500">총 무게</span>
                    <div class="text-2xl font-bold text-indigo-600" id="total-weight">0 lb</div>
                </div>
            </div>
            <button id="reset-plates" class="w-full bg-indigo-600 text-white py-2 px-4 h-10 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
              초기화
            </button>
        </div>
    </div>
        
      </div>
    </div>
  </div>
</body>
<script type="module" src="src/main.js"></script>
</html>
